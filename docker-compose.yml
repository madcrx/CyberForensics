version: '3.8'

services:
  forensics:
    build: .
    image: cyberforensics:latest
    container_name: cyberforensics_toolkit
    hostname: forensics-lab
    stdin_open: true
    tty: true
    volumes:
      - ./data:/data
      - ./tools:/app/tools
      - ./cli:/app/cli
      - evidence_data:/data/evidence
      - reports_data:/data/reports
    networks:
      - forensics_net
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=UTC
    command: /bin/bash

  # Web Portal - Professional Browser Interface
  web_portal:
    build: .
    image: cyberforensics:latest
    container_name: cyberforensics_web_portal
    hostname: forensics-web
    ports:
      - "5000:5000"
    volumes:
      - ./data:/data
      - ./tools:/app/tools
      - ./web:/app/web
      - evidence_data:/data/evidence
      - reports_data:/data/reports
    networks:
      - forensics_net
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      - PYTHONUNBUFFERED=1
      - FLASK_APP=web/app.py
      - FLASK_ENV=development
      - TZ=UTC
    command: python web/app.py
    depends_on:
      - forensics

  # Static File Server for Reports
  web_interface:
    image: nginx:alpine
    container_name: forensics_reports
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./reports:/usr/share/nginx/html/reports:ro
      - ./docs:/usr/share/nginx/html/docs:ro
    networks:
      - forensics_net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  forensics_net:
    driver: bridge

volumes:
  evidence_data:
  reports_data:
