# CyberForensics Reports Server
# This configuration ensures the custom reports page is served instead of nginx default
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Set reports directory as root
    root /usr/share/nginx/html/reports;
    index index.html index.htm;

    # Main location - serve custom index page
    location = / {
        # Explicitly serve our index.html
        try_files /index.html /index.htm =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Reports file listing (autoindex enabled)
    location /files {
        alias /usr/share/nginx/html/reports/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        autoindex_format html;
        charset utf-8;

        # Enable CORS
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;

        # Serve files and directories
        location ~ \.(txt|json|html|pdf|csv|pcap|log)$ {
            add_header Content-Disposition 'attachment';
        }
    }

    # Direct file access from reports root
    location ~ ^/[^/]+\.(txt|json|html|pdf|csv|pcap|log|zip|tar|gz)$ {
        root /usr/share/nginx/html/reports;
        add_header Access-Control-Allow-Origin * always;
        try_files $uri =404;
    }

    # Documentation directory
    location /docs {
        alias /usr/share/nginx/html/docs/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        try_files $uri $uri/ =404;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "Healthy\n";
        add_header Content-Type text/plain;
    }

    # Block access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Custom error pages
    error_page 404 /404.html;
    location = /404.html {
        internal;
        default_type text/html;
        return 404 '<html><head><title>404 Not Found</title></head><body><h1>404 Not Found</h1><p>The requested resource was not found.</p><p><a href="/">Go to Reports Home</a> | <a href="/files">Browse Files</a></p></body></html>';
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        default_type text/html;
        return 500 '<html><head><title>Server Error</title></head><body><h1>Server Error</h1><p><a href="/">Go to Reports Home</a></p></body></html>';
    }
}
