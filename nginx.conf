# Remove default server block completely
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name localhost _;

    # Disable default nginx welcome page
    root /usr/share/nginx/html;

    # Main location - redirect to reports
    location = / {
        return 301 /reports/;
    }

    # Reports directory with autoindex
    location /reports {
        alias /usr/share/nginx/html/reports/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        autoindex_format html;
        charset utf-8;

        # Try to serve file, then directory, then 404
        try_files $uri $uri/ =404;

        # Enable CORS for web portal access
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;

        # Handle OPTIONS requests
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Properly serve common file types
        types {
            text/html                             html htm shtml;
            text/css                              css;
            text/xml                              xml;
            application/javascript                js;
            application/json                      json;
            application/pdf                       pdf;
            image/jpeg                            jpeg jpg;
            image/png                             png;
            image/gif                             gif;
            text/plain                            txt;
            text/csv                              csv;
            application/zip                       zip;
            application/x-rar-compressed          rar;
        }

        # Cache static assets
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    # Documentation directory (if needed)
    location /docs {
        alias /usr/share/nginx/html/docs/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        try_files $uri $uri/ =404;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "Healthy\n";
        add_header Content-Type text/plain;
    }

    # Block access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Error pages - custom or simple text responses
    error_page 404 /404.html;
    location = /404.html {
        internal;
        default_type text/html;
        return 404 '<html><head><title>404 Not Found</title></head><body><h1>404 Not Found</h1><p>The requested resource was not found.</p><p><a href="/reports/">Go to Reports</a></p></body></html>';
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        default_type text/html;
        return 500 '<html><head><title>Server Error</title></head><body><h1>Server Error</h1><p><a href="/reports/">Go to Reports</a></p></body></html>';
    }
}
